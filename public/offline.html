<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>drip</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b0f; color: #f2f2f5;
    font: 500 17px/1.4 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(env(safe-area-inset-top), 16px) 24px max(env(safe-area-inset-bottom), 16px);
    box-sizing: border-box; text-align: center; -webkit-font-smoothing: antialiased;
  }
  .drip { width: 40px; height: 56px; margin: 0 auto 28px; }
  h1 { font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 12px; font-weight: 700; }
  p { margin: 0; color: #9a9aa6; }
  button {
    margin-top: 28px; padding: 12px 22px; border: 0; border-radius: 999px;
    background: #c8f542; color: #0b0b0f; font: inherit; font-weight: 700;
    transition: transform .12s ease;
  }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <main>
    <svg class="drip" viewBox="0 0 40 56" aria-hidden="true">
      <path fill="#c8f542" d="M20 0 C24 12 40 26 40 38 A20 20 0 0 1 0 38 C0 26 16 12 20 0 Z"/>
    </svg>
    <h1>back online soon</h1>
    <p>no signal right now. anything you already scrolled is still here.</p>
    <button type="button" onclick="location.reload()">try again</button>
  </main>
</body>
</html>
